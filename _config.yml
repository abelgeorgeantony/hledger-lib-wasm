# Jekyll configuration for GitHub Pages
title: hledger WASM
description: hledger running in the browser via WebAssembly

# Exclude development, Haskell, and submodule directories to prevent Jekyll build failures
exclude:
  - bridge/
  - scripts/
  - stubs/
  - vendor/
  - wasm/
  - build.sh
  - cabal.project
  - "*.cabal"
  - .ghc.environment.*
