<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hledger WASM Demo</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f5f7f8;
      color: #172026;
    }

    body {
      margin: 0;
    }

    main {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(320px, 1fr);
      gap: 20px;
      min-height: 100vh;
      padding: 20px;
    }

    section {
      min-width: 0;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d9e0e4;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
      padding: 16px;
    }

    h1,
    h2 {
      margin: 0 0 12px;
      letter-spacing: 0;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      margin: 14px 0;
      font-size: 13px;
      font-weight: 650;
    }

    input,
    textarea,
    button,
    pre {
      font: inherit;
    }

    input[type="file"] {
      max-width: 100%;
    }

    textarea,
    pre {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #cbd5da;
      border-radius: 8px;
      background: #fbfcfd;
      color: inherit;
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
    }

    pre {
      min-height: 520px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      border: 1px solid #25636f;
      border-radius: 6px;
      background: #2d7784;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      min-height: 38px;
      padding: 8px 12px;
    }

    button.secondary {
      background: #fff;
      color: #25636f;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      color: #47565f;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      pre {
        min-height: 320px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <h1>hledger WASM</h1>

      <label>
        Journal file
        <input id="journal-file" type="file" />
      </label>

      <label>
        Journal text
        <textarea id="journal-text" spellcheck="false">2026-01-01 opening
  assets:bank        $100
  equity:opening

2026-01-02 coffee
  expenses:food       $5
  assets:bank
</textarea>
      </label>

      <div class="actions">
        <button id="check">Check</button>
        <button id="accounts">Accounts</button>
        <button id="balance">Balance</button>
        <button id="register">Register</button>
        <button id="print">Print</button>
        <button id="prices">Prices</button>
        <button id="payees">Payees</button>
        <button id="commodities">Commodities</button>
        <button id="tags">Tags</button>
        <button id="balancesheet">Balancesheet</button>
        <button id="incomestatement">Incomestatement</button>
        <button id="cashflow">Cashflow</button>
        <button id="clear" class="secondary">Clear</button>
      </div>

      <div id="status" class="status">
        Uses ./wasm/hledger-wasm.wasm unless a WASM file is selected.
      </div>
    </section>

    <section class="panel">
      <h2>Output</h2>
      <pre id="output">Build hledger-wasm.wasm, then run a command.</pre>
    </section>
  </main>

  <script type="module">
    import { HledgerSession } from "./js/hledger.js";

    const session = await HledgerSession.create();

    const journalInput = document.querySelector("#journal-file");
    const journalText = document.querySelector("#journal-text");
    const output = document.querySelector("#output");
    const status = document.querySelector("#status");
    const reportButtons = [
      document.querySelector("#check"),
      document.querySelector("#accounts"),
      document.querySelector("#balance"),
    ];

    let debounceTimer = null;

    const result = await session.loadJournal(journalText.value);
    if (session.isLoaded) {
      status.textContent = "Journal loaded.";
      output.textContent = "Journal loaded.";
    } else {
      status.textContent = "Journal error: " + result.error;
      output.textContent = "Journal error: " + result.error;
    }

    async function reparse() {
      const result = await session.loadJournal(journalText.value);
      if (result.ok) {
        status.textContent = "Journal loaded.";
      } else {
        status.textContent = "Journal error: " + result.error;
      }
      setReportButtonsEnabled(session.isLoaded);
    }

    function setReportButtonsEnabled(enabled) {
      for (const btn of reportButtons) btn.disabled = !enabled;
    }

    function scheduleReparse() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(reparse, 300);
    }

    await reparse(); // parse the default sample text once, before wiring up any listeners

    journalText.addEventListener("input", scheduleReparse);

    journalInput.addEventListener("change", async () => {
      const file = journalInput.files[0];
      if (!file) return;
      journalText.value = await file.text();
      await reparse();
    });

    document.querySelector("#check").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("check", () => session.check());
    });
    document.querySelector("#accounts").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("accounts", () => session.accounts());
    });
    document.querySelector("#balance").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("balance", () => session.balance());
    });
    document.querySelector("#register").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("register", () => session.register());
    });
    document.querySelector("#print").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("print", () => session.print());
    });
    document.querySelector("#prices").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("prices", () => session.prices());
    });
    document.querySelector("#payees").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("payees", () => session.payees());
    });
    document.querySelector("#commodities").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("commodities", () => session.commodities());
    });
    document.querySelector("#tags").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("tags", () => session.tags());
    });
    document.querySelector("#balancesheet").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("balancesheet", () => session.balancesheet());
    });
    document.querySelector("#incomestatement").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("incomestatement", () => session.incomestatement());
    });
    document.querySelector("#cashflow").addEventListener("click", () => {
      if (!session.isLoaded) { status.textContent = "No valid journal loaded."; return; }
      run("cashflow", () => session.cashflow());
    });
    document.querySelector("#clear").addEventListener("click", () => {
      output.textContent = "";
      status.textContent = "Output cleared.";
    });

    async function run(name, action) {
      setBusy(true);
      status.textContent = `Running ${name}...`;
      try {
        const result = await action();
        output.textContent = JSON.stringify(result, null, 2);
        status.textContent = `${name} finished.`;
      } catch (error) {
        output.textContent = error.stack || String(error);
        status.textContent = `${name} failed.`;
      } finally {
        setBusy(false);
        setReportButtonsEnabled(session.isLoaded); // restore correct state, don't just blanket re-enable
      }
    }

    function setBusy(busy) {
      for (const button of document.querySelectorAll("button")) {
        button.disabled = busy;
      }
    }
  </script>
</body>

</html>
